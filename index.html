<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Midas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23111'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/midas.css" />
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      try {
        var raw = localStorage.getItem('midas.state.v1');
        var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
        if (!theme || theme === 'system') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">Midas</a>
      <nav class="nav" id="nav">
        <a href="#/" data-route="dashboard">Dashboard</a>
        <a href="#/trade" data-route="trade">Trade</a>
        <a href="#/activity" data-route="activity">Activity</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
      <div class="topbar-right">
        <span class="feed" id="feed-status" title="Data feed status">
          <i class="dot"></i><span class="feed-label">Offline</span>
        </span>
        <button class="btn btn-primary" id="deposit-btn">Deposit</button>
        <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="8" cy="8" r="6" />
            <path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main" id="view"></main>

  <div id="modal-root"></div>
  <div id="toast-root" class="toasts"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
